[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lsbu-cutebot-sim"
version = "0.1.0"
description = "micro:bit + Elecfreaks Cutebot simulator for running MicroPython lab code in PyCharm"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["microbit", "cutebot_sim"]
py-modules = ["utime", "machine", "neopixel", "music"]
